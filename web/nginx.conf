server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS — re-resolve after api/session-worker recreate
    # (literal proxy_pass http://api:8080 caches IP at nginx start).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $keeppam_api http://api:8080;
        proxy_pass $keeppam_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /scim/ {
        set $keeppam_api http://api:8080;
        proxy_pass $keeppam_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /healthz {
        set $keeppam_api http://api:8080;
        proxy_pass $keeppam_api/healthz;
    }

    location / {
        try_files $uri /index.html;
    }
}
