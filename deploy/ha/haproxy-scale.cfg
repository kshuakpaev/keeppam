global
  maxconn 20000
  log stdout format raw local0

defaults
  log global
  timeout connect 5s
  timeout client 3600s
  timeout server 3600s
  timeout tunnel 3600s
  retries 2

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend fe_http
  bind :8080
  mode http
  option httplog
  default_backend be_api

backend be_api
  mode http
  balance roundrobin
  option httpchk GET /readyz
  http-check expect status 200
  default-server inter 3s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
  server-template a 16 api:8080 check
  server api-b api-b:8080 check

frontend fe_ssh
  bind :2222
  mode tcp
  option tcplog
  default_backend be_ssh

backend be_ssh
  mode tcp
  balance roundrobin
  option tcp-check
  default-server inter 3s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
  server-template w 32 session-worker:2222 check
  server wb session-worker-b:2222 check

