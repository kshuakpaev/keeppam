global
  maxconn 4096
  log stdout format raw local0

defaults
  log global
  timeout connect 5s
  timeout client 3600s
  timeout server 3600s
  timeout tunnel 3600s
  retries 2

frontend fe_http
  bind :8080
  mode http
  option httplog
  default_backend be_api

backend be_api
  mode http
  balance roundrobin
  option httpchk GET /readyz
  http-check expect status 200
  default-server inter 3s fall 2 rise 2
  server api1 api:8080 check
  server api2 api-b:8080 check

frontend fe_ssh
  bind :2222
  mode tcp
  option tcplog
  default_backend be_ssh

backend be_ssh
  mode tcp
  balance roundrobin
  option tcp-check
  default-server inter 3s fall 2 rise 2
  server w1 session-worker:2222 check
  server w2 session-worker-b:2222 check

frontend fe_pgwire
  bind :15432
  mode tcp
  default_backend be_pgwire

backend be_pgwire
  mode tcp
  balance roundrobin
  option tcp-check
  server a1 api:15432 check
  server a2 api-b:15432 check

frontend fe_mysqlwire
  bind :13306
  mode tcp
  default_backend be_mysqlwire

backend be_mysqlwire
  mode tcp
  balance roundrobin
  option tcp-check
  server a1 api:13306 check
  server a2 api-b:13306 check

frontend fe_mssqlwire
  bind :11433
  mode tcp
  default_backend be_mssqlwire

backend be_mssqlwire
  mode tcp
  balance roundrobin
  option tcp-check
  server a1 api:11433 check
  server a2 api-b:11433 check

frontend fe_k8s
  bind :16443
  mode tcp
  default_backend be_k8s

backend be_k8s
  mode tcp
  balance roundrobin
  option tcp-check
  server a1 api:16443 check
  server a2 api-b:16443 check
