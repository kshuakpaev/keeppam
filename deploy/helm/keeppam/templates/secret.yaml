{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keeppam.fullname" . }}
  labels:
    {{- include "keeppam.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.databaseUrl | quote }}
  redis-url: {{ .Values.redisUrl | quote }}
  data-key: {{ .Values.dataKey | quote }}
{{- end }}
