apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keeppam.fullname" . }}-api
  labels:
    {{- include "keeppam.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "keeppam.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "keeppam.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: api
                    app.kubernetes.io/instance: {{ .Release.Name }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: []
          ports:
            - name: http
              containerPort: 8080
            - name: pgwire
              containerPort: 15432
            - name: mysqlwire
              containerPort: 13306
            - name: mssqlwire
              containerPort: 11433
            - name: oraclewire
              containerPort: 11521
            - name: k8sapi
              containerPort: 16443
          env:
            - name: KEEPPAM_MODE
              value: api
            - name: KEEPPAM_HTTP_ADDR
              value: ":8080"
            - name: KEEPPAM_DRAIN_TIMEOUT
              value: {{ .Values.env.drainTimeout | quote }}
            - name: KEEPPAM_COOKIE_SECURE
              value: {{ .Values.env.cookieSecure | quote }}
            - name: KEEPPAM_CORS_ORIGIN
              value: {{ .Values.env.corsOrigin | quote }}
            - name: KEEPPAM_RECORDINGS_DIR
              value: {{ .Values.env.recordingsDir | quote }}
            - name: KEEPPAM_RECORDINGS_BACKEND
              value: {{ .Values.env.recordingsBackend | quote }}
            - name: KEEPPAM_GUACD_ADDR
              value: {{ .Values.env.guacdAddr | quote }}
            - name: KEEPPAM_TRUSTED_PROXIES
              value: {{ .Values.env.trustedProxies | quote }}
            - name: KEEPPAM_DIGITALID_LAB
              value: {{ .Values.env.digitalidLab | default "false" | quote }}
            - name: KEEPPAM_DATA_KEY_SOURCE
              value: env
            - name: KEEPPAM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "keeppam.secretName" . }}
                  key: database-url
            - name: KEEPPAM_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "keeppam.secretName" . }}
                  key: redis-url
            - name: KEEPPAM_DATA_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "keeppam.secretName" . }}
                  key: data-key
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "3"]
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          volumeMounts:
            - name: recordings
              mountPath: {{ .Values.env.recordingsDir }}
      terminationGracePeriodSeconds: 100
      volumes:
        - name: recordings
          {{- if .Values.recordings.persistence }}
          persistentVolumeClaim:
            claimName: {{ include "keeppam.fullname" . }}-recordings
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keeppam.fullname" . }}-api
  labels:
    {{- include "keeppam.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.api.type }}
  selector:
    app.kubernetes.io/name: {{ include "keeppam.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: http
    - name: pgwire
      port: {{ .Values.service.pgwire.port }}
      targetPort: pgwire
    - name: mysqlwire
      port: {{ .Values.service.mysqlwire.port }}
      targetPort: mysqlwire
    - name: mssqlwire
      port: {{ .Values.service.mssqlwire.port }}
      targetPort: mssqlwire
    - name: oraclewire
      port: {{ .Values.service.oraclewire.port }}
      targetPort: oraclewire
    - name: k8sapi
      port: {{ .Values.service.k8sapi.port }}
      targetPort: k8sapi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "keeppam.fullname" . }}-api
spec:
  minAvailable: {{ .Values.podDisruptionBudget.apiMinAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "keeppam.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
