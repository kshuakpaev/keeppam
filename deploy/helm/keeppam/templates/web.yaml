apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keeppam.fullname" . }}-web
  labels:
    {{- include "keeppam.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "keeppam.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "keeppam.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.webImage.repository }}:{{ .Values.webImage.tag }}"
          imagePullPolicy: {{ .Values.webImage.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx
          configMap:
            name: {{ include "keeppam.fullname" . }}-web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "keeppam.fullname" . }}-web
  labels:
    {{- include "keeppam.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.web.type }}
  selector:
    app.kubernetes.io/name: {{ include "keeppam.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.web.port }}
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "keeppam.fullname" . }}
  labels:
    {{- include "keeppam.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "keeppam.fullname" $ }}-web
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.guacd.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keeppam.fullname" . }}-guacd
  labels:
    {{- include "keeppam.labels" . | nindent 4 }}
    app.kubernetes.io/component: guacd
spec:
  replicas: {{ .Values.replicaCount.guacd | default 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: guacd
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: guacd
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: guacd
          image: {{ .Values.guacd.image }}
          ports:
            - containerPort: 4822
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  labels:
    {{- include "keeppam.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: guacd
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 4822
      targetPort: 4822
{{- end }}
