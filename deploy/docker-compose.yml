services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keeppam
      POSTGRES_PASSWORD: keeppam
      POSTGRES_DB: keeppam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keeppam -d keeppam"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: deploy-api:latest
    user: "0:0"
    volumes:
      - ../deploy/auth-server:/app/auth-server:ro
      - ../services/auth/migrations:/app/migrations:ro
      - recordings:/tmp/recordings
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
      - "15432:15432"
      - "13306:13306"
      - "16443:16443"
    environment:
      KEEPPAM_MODE: "api"
      KEEPPAM_HTTP_ADDR: ":8080"
      KEEPPAM_PG_WIRE_ADDR: ":15432"
      KEEPPAM_MYSQL_WIRE_ADDR: ":13306"
      KEEPPAM_K8S_API_ADDR: ":16443"
      KEEPPAM_K8S_PUBLIC_URL: "https://localhost:16443"
      KEEPPAM_DATABASE_URL: "postgres://keeppam:keeppam@postgres:5432/keeppam?sslmode=disable"
      KEEPPAM_REDIS_URL: "redis://redis:6379/0"
      # 32-byte local-dev key (base64)
      KEEPPAM_DATA_KEY: "a2VlcHBhbS1sb2NhbC1kZXYta2V5LTMyLWJ5dGVzISE="
      KEEPPAM_BOOTSTRAP_ADMIN_PASSWORD: "ChangeMeNow!1"
      KEEPPAM_COOKIE_SECURE: "false"
      KEEPPAM_CORS_ORIGIN: "http://localhost:5173"
      KEEPPAM_MIGRATIONS_DIR: "/app/migrations"
      KEEPPAM_RECORDINGS_DIR: "/tmp/recordings"
      KEEPPAM_DATA_KEY_SOURCE: "env"
      KEEPPAM_RECORDINGS_BACKEND: "local"
      KEEPPAM_ALERT_WEBHOOK_TOKEN: "keeppam-alert-stand"
      KEEPPAM_OTEL_ENDPOINT: "http://jaeger:4318"
      # Prod (см. docs/prod-infra.txt, docs/kms.txt):
      # KEEPPAM_DATA_KEY_SOURCE: "file"
      # KEEPPAM_DATA_KEY_FILE: "/run/secrets/keeppam-data-key"
      # KEEPPAM_DATA_KEY_SOURCE: "vault"   # или aws | gcp | azure
      # KEEPPAM_KMS_CIPHERTEXT: "..."
      # KEEPPAM_RECORDINGS_BACKEND: "s3"
      # KEEPPAM_S3_ENDPOINT: "http://minio:9000"
      # KEEPPAM_S3_BUCKET: "keeppam-recordings"
      # KEEPPAM_S3_ACCESS_KEY: "minio"
      # KEEPPAM_S3_SECRET_KEY: "minio123"
      # KEEPPAM_S3_OBJECT_LOCK_MODE: "GOVERNANCE"
      # KEEPPAM_S3_OBJECT_LOCK_DAYS: "90"
      # KEEPPAM_TLS_CERT_FILE: "/etc/keeppam/tls/server.crt"
      # KEEPPAM_TLS_KEY_FILE: "/etc/keeppam/tls/server.key"
      # KEEPPAM_TLS_CLIENT_CA_FILE: "/etc/keeppam/tls/client-ca.crt"
      # KEEPPAM_TLS_REQUIRE_CLIENT_CERT: "true"
      KEEPPAM_GUACD_ADDR: "guacd:4822"
      KEEPPAM_GUACENC_URL: "http://guacenc:8099"
      KEEPPAM_ACCESS_REQUEST_TTL: "24h"
      KEEPPAM_ISO_IMAGE: "keeppam-iso-browser:local"
      KEEPPAM_ISO_NETWORK: "deploy_default"
      KEEPPAM_ISO_DOCKER_SOCK: "/var/run/docker.sock"
      # GeoIP ABAC (docs/geoip.txt): без файла — только LAN
      # KEEPPAM_GEOIP_DB: "/var/lib/keeppam/GeoLite2-Country.mmdb"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      guacd:
        condition: service_started
      guacenc:
        condition: service_started
      jaeger:
        condition: service_started

  guacd:
    image: guacamole/guacd:1.5.5
    user: "0:0"
    volumes:
      - recordings:/tmp/recordings
    restart: unless-stopped

  guacenc:
    image: keeppam-guacenc:1.5.5
    build:
      context: ./guacenc
    user: "0:0"
    volumes:
      - recordings:/tmp/recordings
    environment:
      PORT: "8099"
    restart: unless-stopped

  session-worker:
    image: deploy-api:latest
    user: "0:0"
    volumes:
      - ../deploy/auth-server:/app/auth-server:ro
      - recordings:/tmp/recordings
      - sshhost:/var/lib/keeppam/ssh
    ports:
      - "2222:2222"
    environment:
      KEEPPAM_MODE: "ssh"
      KEEPPAM_DATABASE_URL: "postgres://keeppam:keeppam@postgres:5432/keeppam?sslmode=disable"
      KEEPPAM_REDIS_URL: "redis://redis:6379/0"
      KEEPPAM_DATA_KEY: "a2VlcHBhbS1sb2NhbC1kZXYta2V5LTMyLWJ5dGVzISE="
      KEEPPAM_DATA_KEY_SOURCE: "env"
      KEEPPAM_RECORDINGS_DIR: "/tmp/recordings"
      KEEPPAM_RECORDINGS_BACKEND: "local"
      # Prod KMS: те же KEEPPAM_DATA_KEY_SOURCE / KEEPPAM_KMS_CIPHERTEXT, что у api (docs/kms.txt)
      KEEPPAM_SSH_ADDR: ":2222"
      KEEPPAM_SSH_HOST_KEY: "/var/lib/keeppam/ssh/hostkey"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  demo-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pam
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: postgres
    volumes:
      - ./demo-postgres/init.sql:/docker-entrypoint-initdb.d/01-demo.sql:ro
      - demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pam -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  iso-browser:
    image: keeppam-iso-browser:local
    build:
      context: ./iso-browser
    profiles: ["build"]

  web:
    build:
      context: ../web
    ports:
      - "5173:80"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - alertmanager
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - amdata:/alertmanager
    ports:
      - "9093:9093"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ChangeMeNow!1
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/keeppam.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  recordings:
  sshhost:
  demo_pgdata:
  promdata:
  grafanadata:
  amdata:
