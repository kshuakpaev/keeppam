# KeepPAM AI copilot overlay (SOW-AI-COPILOT)
#
#   KEEPPAM_AI=1 docker compose -f docker-compose.yml -f compose.ai.yml up -d
#
# Core distro stays unchanged. This overlay adds an in-process-compatible
# worker (same api image, KEEPPAM_MODE=ai) and optional Ollama runtime.
# Default Config → ИИ-помощник is mock://local (no GPU). Pick a free
# Ollama model (Llama 3.2, Qwen 2.5, Mistral, Gemma 2, Phi-3) and
# «Скачать в Ollama». Point endpoint at http://ai-runtime:11434.

services:
  ai-worker:
    image: deploy-api:latest
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../deploy/auth-server:/app/auth-server:ro
      - ../services/auth/migrations:/app/migrations:ro
    environment:
      KEEPPAM_MODE: "ai"
      KEEPPAM_HTTP_ADDR: ":8080"
      KEEPPAM_DATABASE_URL: "postgres://keeppam:keeppam@postgres:5432/keeppam?sslmode=disable"
      KEEPPAM_REDIS_URL: "redis://redis:6379/0"
      KEEPPAM_DATA_KEY: "${KEEPPAM_DATA_KEY:-a2VlcHBhbS1sb2NhbC1kZXYta2V5LTMyLWJ5dGVzISE=}"
      KEEPPAM_DATA_KEY_SOURCE: "env"
      KEEPPAM_COOKIE_SECURE: "false"
      KEEPPAM_MIGRATIONS_DIR: "/app/migrations"
      KEEPPAM_AI_ALLOW_EXTERNAL: "${KEEPPAM_AI_ALLOW_EXTERNAL:-0}"
      KEEPPAM_AI_API_KEY: "${KEEPPAM_AI_API_KEY:-}"
    healthcheck:
      test: ["CMD", "/app/auth-server", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  ai-runtime:
    image: ollama/ollama:latest
    hostname: ai-runtime
    volumes:
      - ai-ollama:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 25s

volumes:
  ai-ollama:
