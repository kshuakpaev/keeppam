# Overlay: 2 API + 2 session-worker behind HAProxy + PgBouncer (session pool).
# Requires Docker Compose v2.24+ (`!override` / `!reset`).
#
#   docker compose -f docker-compose.yml -f compose.ha.yml up -d
#
# Postgres auto-failover (repmgr + Pgpool), replaces pgbouncer DSN:
#   docker compose -f docker-compose.yml -f compose.ha.yml -f compose.pgha.yml up -d
#
# Optional streaming replica without auto-failover:
#   docker compose -f docker-compose.yml -f compose.ha.yml --profile pg-ha up -d

services:
  api:
    ports: !override []
    environment:
      KEEPPAM_ISO_PROXY_BASE: "http://edge:8080"
      KEEPPAM_DRAIN_TIMEOUT: "90s"
      KEEPPAM_DATABASE_URL: "postgres://keeppam:keeppam@pgbouncer:5432/keeppam?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped

  api-b:
    extends:
      file: docker-compose.yml
      service: api
    ports: !override []
    environment:
      KEEPPAM_ISO_PROXY_BASE: "http://edge:8080"
      KEEPPAM_DRAIN_TIMEOUT: "90s"
      KEEPPAM_DATABASE_URL: "postgres://keeppam:keeppam@pgbouncer:5432/keeppam?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped

  session-worker:
    ports: !override []
    environment:
      KEEPPAM_HTTP_ADDR: ":8080"
      KEEPPAM_DRAIN_TIMEOUT: "90s"
      KEEPPAM_DATABASE_URL: "postgres://keeppam:keeppam@pgbouncer:5432/keeppam?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped

  session-worker-b:
    extends:
      file: docker-compose.yml
      service: session-worker
    ports: !override []
    environment:
      KEEPPAM_HTTP_ADDR: ":8080"
      KEEPPAM_DRAIN_TIMEOUT: "90s"
      KEEPPAM_DATABASE_URL: "postgres://keeppam:keeppam@pgbouncer:5432/keeppam?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1-p1
    environment:
      DATABASE_URL: "postgres://keeppam:keeppam@postgres:5432/keeppam"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: session
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "50"
      LISTEN_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  edge:
    image: haproxy:2.9-alpine
    depends_on:
      api:
        condition: service_healthy
      api-b:
        condition: service_healthy
      session-worker:
        condition: service_healthy
      session-worker-b:
        condition: service_healthy
    ports:
      - "${KEEPPAM_API_HOST_PORT:-8080}:8080"
      - "2222:2222"
      - "2121:2121"
      - "2323:2323"
      - "2324:2324"
      - "1081:1081"
      - "15432:15432"
      - "13306:13306"
      - "11433:11433"
      - "11521:11521"
      - "16443:16443"
    volumes:
      - ./ha/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    volumes:
      - ./ha/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - api-b

  prometheus:
    volumes: !override
      - ./ha/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus

  postgres-replica:
    profiles: ["pg-ha"]
    image: postgres:16-alpine
    environment:
      PGUSER: keeppam
      PGPASSWORD: keeppam
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - ./ha/postgres-replica.sh:/replica.sh:ro
      - pgdata_replica:/var/lib/postgresql/data
    entrypoint: ["/bin/sh", "/replica.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_replica:
