# Overlay: 2 API + 2 session-worker behind HAProxy.
# Requires Docker Compose v2.24+ (`!override` / `!reset`).
#
#   docker compose -f docker-compose.yml -f compose.ha.yml up -d
#
# Optional streaming replica (not automatic failover):
#   docker compose -f docker-compose.yml -f compose.ha.yml --profile pg-ha up -d

services:
  api:
    ports: !override []
    environment:
      KEEPPAM_ISO_PROXY_BASE: "http://edge:8080"
      KEEPPAM_DRAIN_TIMEOUT: "90s"
    restart: unless-stopped

  api-b:
    extends:
      file: docker-compose.yml
      service: api
    ports: !override []
    environment:
      KEEPPAM_ISO_PROXY_BASE: "http://edge:8080"
      KEEPPAM_DRAIN_TIMEOUT: "90s"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  session-worker:
    ports: !override []
    environment:
      KEEPPAM_HTTP_ADDR: ":8080"
      KEEPPAM_DRAIN_TIMEOUT: "90s"
    restart: unless-stopped

  session-worker-b:
    extends:
      file: docker-compose.yml
      service: session-worker
    ports: !override []
    environment:
      KEEPPAM_HTTP_ADDR: ":8080"
      KEEPPAM_DRAIN_TIMEOUT: "90s"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  edge:
    image: haproxy:2.9-alpine
    depends_on:
      api:
        condition: service_healthy
      api-b:
        condition: service_healthy
      session-worker:
        condition: service_healthy
      session-worker-b:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "2222:2222"
      - "15432:15432"
      - "13306:13306"
      - "16443:16443"
    volumes:
      - ./ha/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    volumes:
      - ./ha/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - api-b

  prometheus:
    volumes: !override
      - ./ha/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus

  postgres-replica:
    profiles: ["pg-ha"]
    image: postgres:16-alpine
    environment:
      PGUSER: keeppam
      PGPASSWORD: keeppam
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - ./ha/postgres-replica.sh:/replica.sh:ro
      - pgdata_replica:/var/lib/postgresql/data
    entrypoint: ["/bin/sh", "/replica.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_replica:
