apiVersion: 1

deleteDatasources:
  - name: Jaeger
    orgId: 1

datasources:
  - name: Prometheus
    uid: keeppam-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Tempo
    uid: keeppam-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToMetrics:
        datasourceUid: keeppam-prom
      serviceMap:
        datasourceUid: keeppam-prom
      nodeGraph:
        enabled: true
      search:
        hide: false
