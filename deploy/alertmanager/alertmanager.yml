global:
  resolve_timeout: 5m

route:
  receiver: keeppam
  group_by: ["alertname", "severity"]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: keeppam
    webhook_configs:
      - url: http://api:8080/api/v1/alerts/webhook
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: keeppam-alert-stand
