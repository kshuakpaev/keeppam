[package]
name = "keeppam-endpoint-agent"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "keeppam_endpoint_agent"
path = "src/lib.rs"

[[bin]]
name = "endpoint-agent"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.83"
base64 = "0.22.1"
keeppam-agent-monitor = { path = "../monitor" }
keeppam-agent-protocol = { path = "../protocol" }
rand = "0.8.5"
rusqlite = { version = "0.32.1", features = ["bundled"] }
russh = "0.49.2"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.132"
thiserror = "1.0.64"
tokio = { version = "1.40.0", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
ureq = { version = "2.10.1", default-features = false, features = ["json"] }
uuid = { version = "1.10.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
jpeg-encoder = "0.6"
png = "=0.17.16"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
anyhow = "1.0.89"
async-trait = "0.1.83"
keeppam-agentd = { path = "../agentd" }
rand = "0.8.5"
russh = "0.49.2"
tokio = { version = "1.40.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
ureq = { version = "2.10.1", default-features = false, features = ["json"] }
